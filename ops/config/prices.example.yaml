# Template for ops/config/prices.yaml (git-ignored).
# Fill in per-million-token prices from the provider's CURRENT price page. These are placeholders,
# not real prices; the meter refuses to compute spend while any value is null.
# Keys must match the model names you set in LLM_MODEL_NAME / LLM_BOOST_MODEL_NAME.

currency: USD
source_url: ""          # the price page you copied these from
checked_on: ""          # date you checked it (YYYY-MM-DD)

models:
  FAST_MODEL_NAME_HERE:
    input_per_million: null
    output_per_million: null
  STRONG_MODEL_NAME_HERE:
    input_per_million: null
    output_per_million: null
